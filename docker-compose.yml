services:
  postgres:
    image: postgres:16-alpine
    container_name: parent-first-academy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: academy
      POSTGRES_PASSWORD: academy_dev_password
      POSTGRES_DB: parent_first_academy
    ports:
      - "5432:5432"
    volumes:
      - academy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academy -d parent_first_academy"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  academy_pgdata:
